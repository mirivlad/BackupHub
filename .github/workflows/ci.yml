name: Go CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: false
      - name: Verify locked Go dependencies
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Tests
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/backuphub
  restic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: false
      - name: Install Restic and PuTTY tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y restic putty-tools
      - name: Backup, commit, restore, verify and recovery test
        run: BACKUPHUB_RESTIC_REQUIRED=1 go test -race ./internal/storage/restic ./internal/backup -v -count=1
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify locked frontend dependencies
        run: |
          npm ci --no-audit --no-fund
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package.json package-lock.json
      - name: Svelte/TypeScript diagnostics
        run: npm run check
      - name: Build production UI
        run: npm run build

  deb:
    name: Debian package and install smoke test
    needs: [go, restic, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y restic postgresql-client openssl
      - name: Compile production assets
        run: |
          cd web && npm ci --no-audit --no-fund && npm run check && npm run build
          cd .. && mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o dist/backuphub ./cmd/backuphub
          if file dist/backuphub | grep -q 'dynamically linked'; then echo 'DEB binary must not depend on the CI runner glibc'; exit 1; fi
      - name: Create and inspect .deb
        run: |
          sh packaging/debian/build.sh 0.6.1
          dpkg-deb -c dist/backuphub_0.6.1_amd64.deb | grep '/usr/share/backuphub/web/index.html'
          dpkg-deb -c dist/backuphub_0.6.1_amd64.deb | grep '/lib/systemd/system/backuphub.service'
      - name: Install Debian package and test HTTPS service
        run: |
          sudo apt-get install -y ./dist/backuphub_0.6.1_amd64.deb
          # postinst starts the daemon and initializes Restic; do not interrupt it.
          ready=false
          for i in $(seq 1 30); do
            if curl -fk --max-time 3 https://127.0.0.1:8443/api/v1/health; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            sudo journalctl -u backuphub -n 100 --no-pager
            exit 1
          fi
          # A subsequent ordinary systemd restart must preserve credentials.
          sudo systemctl restart backuphub
          sleep 2
          curl -fk --retry 5 --retry-delay 2 --retry-connrefused https://127.0.0.1:8443/api/v1/health
          curl -fk https://127.0.0.1:8443/ | grep BackupHub
      - name: End-to-end packaged HTTPS login, backup, ZIP and restore
        run: |
          set -eu
          sudo install -d -o backuphub -g backuphub -m 0700 /opt/backuphub-smoke /opt/backuphub-smoke/Video
          echo 'backuphub-roundtrip' | sudo tee /opt/backuphub-smoke/Video/clip.txt > /dev/null
          sudo chown backuphub:backuphub /opt/backuphub-smoke/Video/clip.txt
          sudo chmod 0600 /opt/backuphub-smoke/Video/clip.txt
          token="$(sudo runuser -u backuphub -- /usr/bin/backuphub bootstrap -data-dir /var/lib/backuphub | sed -n '2p')"
          test -n "$token"
          api=https://127.0.0.1:8443/api/v1
          curl -fksS -H 'Content-Type: application/json' -d "{\"bootstrap_token\":\"$token\",\"username\":\"smokeadmin\",\"password\":\"test-only-password-for-ci-12345\"}" "$api/setup/admin" > /dev/null
          sudo runuser -u backuphub -- /usr/bin/backuphub admin-status -data-dir /var/lib/backuphub | grep 'Administrator configured'
          curl -fksS "$api/setup/status" | python3 -c 'import json,sys;assert json.load(sys.stdin)["setup_required"] is False'
          cookies=/tmp/backuphub-ci-cookies.txt
          curl -fksS -c "$cookies" -H 'Content-Type: application/json' -d '{"username":"smokeadmin","password":"test-only-password-for-ci-12345"}' "$api/auth/login" > /dev/null
          csrf="$(awk '$6 == "backuphub_csrf" {print $7}' "$cookies")"
          test -n "$csrf"
          headers=(-H "X-BackupHub-CSRF: $csrf" -H "Content-Type: application/json")
          test "$(curl -ksS -o /dev/null -w '%{http_code}' "$api/system/journal")" = "401"
          curl -fksS -b "$cookies" "$api/system/journal" |
            python3 -c 'import json,sys;assert "BackupHub started" in json.load(sys.stdin)["text"]'
          curl -fksS -b "$cookies" "$api/backup/status" |
            python3 -c 'import json,sys;sources=set(json.load(sys.stdin)["supported_sources"]);assert {"smb","sftp","postgres_1c"} <= sources and "smb1" not in sources'
          # Exercise key import in the packaged systemd service.
          ppk="$(mktemp -d)"
          printf '\n' > "$ppk/empty-passphrase"
          puttygen -t ed25519 -q --ppk-param version=3 --new-passphrase "$ppk/empty-passphrase" -o "$ppk/fixture.ppk"
          python3 -c 'import json,pathlib,sys; print(json.dumps(dict(name="CI PuTTY key",kind="sftp",host="localhost",path="/backup",username="ci",auth_method="key",private_key=pathlib.Path(sys.argv[1]).read_text())))' "$ppk/fixture.ppk" |
            curl -fksS -b "$cookies" "${headers[@]}" --data-binary @- "$api/backup/sources" |
            python3 -c 'import json,sys; source=json.load(sys.stdin); assert source["auth_method"]=="key" and "private_key" not in source'
          response="$(curl -fksS -b "$cookies" "${headers[@]}" -d '{"name":"CI local dataset","kind":"local","path":"/opt/backuphub-smoke"}' "$api/backup/sources")"
          source_id="$(printf '%s' "$response" | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')"
          test -n "$source_id"
          # Adding a source must not add an implicit job.
          curl -fksS -b "$cookies" "$api/backup/jobs" | python3 -c 'import json,sys;assert json.load(sys.stdin)["jobs"] == []'
          # Edit source: user and password are not lost on an ordinary update.
          source_json='{"name":"CI renamed dataset","kind":"local","path":"/opt/backuphub-smoke"}'
          response="$(curl -fksS -X PUT -b "$cookies" "${headers[@]}" -d "$source_json" "$api/backup/sources/$source_id")"
          printf '%s' "$response" | python3 -c 'import json,sys;v=json.load(sys.stdin);assert v["name"]=="CI renamed dataset";assert v["access_status"]=="ok"'
          # Preview five upcoming cron runs (without creating an extra schedule).
          cron_json='{"mode":"cron","cron_expression":"15 8 * * 1-5","timezone":"UTC","first_run":"2099-01-01T00:00"}'
          response="$(curl -fksS -b "$cookies" "${headers[@]}" -d "$cron_json" "$api/backup/jobs/preview")"
          printf '%s' "$response" | python3 -c 'import json,sys;assert len(json.load(sys.stdin)["next_runs"])==5'
          # Creating the job must NOT trigger a backup automatically.
          job_json="$(python3 -c 'import json,sys;print(json.dumps(dict(name="CI every 7 days",source_id=sys.argv[1],repository_id="primary",schedule=dict(mode="interval",interval_unit="days",interval_value=7,timezone="UTC",first_run="2099-01-01T02:00"))))' "$source_id")"
          response="$(curl -fksS -b "$cookies" "${headers[@]}" -d "$job_json" "$api/backup/jobs")"
          job_id="$(printf '%s' "$response" | python3 -c 'import json,sys;v=json.load(sys.stdin);assert v["schedule"]["interval_value"]==7;print(v["id"])')"
          test -n "$job_id"
          # Edit the same job in-place; retain its ID and snapshot associations.
          updated_json="$(python3 -c 'import json,sys;print(json.dumps(dict(name="CI cron job",source_id=sys.argv[1],repository_id="primary",schedule=dict(mode="cron",cron_expression="0 2 * * 1-5",timezone="UTC",first_run="2099-01-01T00:00"))))' "$source_id")"
          response="$(curl -fksS -X PUT -b "$cookies" "${headers[@]}" -d "$updated_json" "$api/backup/jobs/$job_id")"
          printf '%s' "$response" | python3 -c 'import json,sys;v=json.load(sys.stdin);assert v["schedule"]["mode"]=="cron"'
          test "$(curl -ksS -o /dev/null -w '%{http_code}' -b "$cookies" "$api/backup/schedules")" = "404"
          # Manual execution must not rewrite the next planned cron start.
          next_before="$(curl -fksS -b "$cookies" "$api/backup/jobs" | python3 -c 'import json,sys;print(next(j["next_run"] for j in json.load(sys.stdin)["jobs"] if j["name"]=="CI cron job"))')"
          curl -fksS -b "$cookies" "${headers[@]}" -X POST "$api/backup/jobs/$job_id/run" > /dev/null
          next_after="$(curl -fksS -b "$cookies" "$api/backup/jobs" | python3 -c 'import json,sys;print(next(j["next_run"] for j in json.load(sys.stdin)["jobs"] if j["name"]=="CI cron job"))')"
          test "$next_before" = "$next_after"
          snapshot=""
          for i in $(seq 1 60); do
            response="$(curl -fksS -b "$cookies" "$api/backup/snapshots?source_id=$source_id")"
            snapshot="$(printf '%s' "$response" | python3 -c 'import json,sys;a=json.load(sys.stdin)["snapshots"];print(a[0]["id"] if a else "")')"
            if [ -n "$snapshot" ]; then break; fi
            sleep 2
          done
          if [ -z "$snapshot" ]; then sudo journalctl -u backuphub -n 100 --no-pager; exit 1; fi
          # The journal links the exact verified snapshot, with elapsed time in history.
          for i in $(seq 1 30); do
            response="$(curl -fksS -b "$cookies" "$api/backup/runs")"
            if printf '%s' "$response" | python3 -c 'import json,sys;assert any(r["state"]=="completed" and r.get("snapshot_id")==sys.argv[1] for r in json.load(sys.stdin)["runs"])' "$snapshot"; then break; fi
            sleep 2
          done
          printf '%s' "$response" | python3 -c 'import json,sys;assert any(r["state"]=="completed" and r.get("snapshot_id")==sys.argv[1] for r in json.load(sys.stdin)["runs"])' "$snapshot"
          curl -fksS -b "$cookies" "$api/backup/snapshots/$snapshot" |
            python3 -c 'import json,sys;v=json.load(sys.stdin);assert v["id"]==sys.argv[1] and v["duration_ms"]>0' "$snapshot"
          curl -fksS -b "$cookies" "$api/backup/workload?timezone=UTC" |
            python3 -c 'import json,sys;v=json.load(sys.stdin);assert len(v["days"])==7 and all(len(d["hours"])==24 for d in v["days"]);assert v["busy_seconds"]>0 and v["observed_seconds"]>=v["busy_seconds"]'
          # A file browser loads one directory page; never a flattened full tree.
          response="$(curl -fksS -b "$cookies" "$api/backup/snapshots/$snapshot/files?dir=.&limit=1")"
          printf '%s' "$response" | python3 -c 'import json,sys;v=json.load(sys.stdin);assert v["directory"]==".";assert len(v["files"])==1;assert v["files"][0]["path"]=="Video";assert v["files"][0]["type"]=="dir"'
          response="$(curl -fksS -b "$cookies" "$api/backup/snapshots/$snapshot/files?dir=Video&limit=20")"
          printf '%s' "$response" | python3 -c 'import json,sys;v=json.load(sys.stdin);assert len(v["files"])==1;assert v["files"][0]["path"]=="Video/clip.txt";assert v["files"][0]["type"]=="file"'
          response="$(curl -fksS -b "$cookies" "$api/backup/snapshots/$snapshot/files?dir=.&q=clip&limit=20")"
          printf '%s' "$response" | python3 -c 'import json,sys;v=json.load(sys.stdin);assert len(v["files"])==1;assert v["files"][0]["path"]=="Video/clip.txt"'
          response="$(curl -fksS -b "$cookies" "$api/backup/snapshots/$snapshot/files?dir=.&folders=1")"
          printf '%s' "$response" | python3 -c 'import json,sys;v=json.load(sys.stdin);assert len(v["files"])==1;assert v["files"][0]["type"]=="dir"'
          status="$(curl -ksS -o /dev/null -w '%{http_code}' -b "$cookies" "$api/backup/snapshots/$snapshot/files?dir=..%2F..")"
          test "$status" = 400
          curl -fksS -b "$cookies" "$api/backup/snapshots/$snapshot/download?path=Video" -o /tmp/backuphub-smoke.zip
          python3 -c 'import zipfile; z=zipfile.ZipFile("/tmp/backuphub-smoke.zip"); assert z.read("Video/clip.txt").strip()==b"backuphub-roundtrip"'
          # ZIP of one selected file and of the full snapshot must be valid
          # and retain paths relative to the backed-up root.
          curl -fksS -b "$cookies" "$api/backup/snapshots/$snapshot/download?path=Video%2Fclip.txt" -o /tmp/backuphub-selected.zip
          python3 -c 'import zipfile; z=zipfile.ZipFile("/tmp/backuphub-selected.zip"); assert z.read("Video/clip.txt").strip()==b"backuphub-roundtrip"'
          curl -fksS -b "$cookies" "$api/backup/snapshots/$snapshot/download" -o /tmp/backuphub-whole.zip
          python3 -c 'import zipfile; z=zipfile.ZipFile("/tmp/backuphub-whole.zip"); assert z.read("Video/clip.txt").strip()==b"backuphub-roundtrip"'
          curl -fksS -b "$cookies" "$api/backup/snapshots/$snapshot/download?mode=single&path=Video%2Fclip.txt" -o /tmp/backuphub-smoke.txt
          grep -x 'backuphub-roundtrip' /tmp/backuphub-smoke.txt
          sudo rm /opt/backuphub-smoke/Video/clip.txt
          result="$(curl -fksS -b "$cookies" "${headers[@]}" -d '{"paths":["Video/clip.txt"]}' "$api/backup/snapshots/$snapshot/restore")"
          restored="$(printf '%s' "$result" | python3 -c 'import json,sys;print(json.load(sys.stdin)["directory"])')"
          test -n "$restored"
          sudo grep -x 'backuphub-roundtrip' "$restored/Video/clip.txt"
          test ! -f /opt/backuphub-smoke/Video/clip.txt
          # Check the separate maintenance ledger through the packaged API.
          missing_csrf="$(curl -ksS -o /dev/null -w '%{http_code}' -b "$cookies" -X POST "$api/backup/snapshots/$snapshot/restore-checks")"
          test "$missing_csrf" = "403"
          curl -fksS -b "$cookies" "${headers[@]}" -X PUT \
            -d '{"mode":"metadata","interval_hours":168}' "$api/backup/storages/primary/check-schedule" |
            python3 -c 'import json,sys;s=json.load(sys.stdin);assert s["interval_hours"]==168 and s["next_run"]'
          wait_check() {
            local endpoint="$1" id="$2" state=""
            for i in $(seq 1 45); do
              response="$(curl -fksS -b "$cookies" "$endpoint")"
              state="$(printf '%s' "$response" | python3 -c 'import json,sys;print(next(r["state"] for r in json.load(sys.stdin)["runs"] if r["id"]==sys.argv[1]))' "$id")"
              case "$state" in passed) return 0;; failed|interrupted) printf '%s\n' "$response"; return 1;; esac
              sleep 2
            done
            printf '%s\n' "$response"
            return 1
          }
          for mode in metadata data; do
            response="$(curl -fksS -b "$cookies" "${headers[@]}" -d "{\"mode\":\"$mode\"}" "$api/backup/storages/primary/checks")"
            operation="$(printf '%s' "$response" | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')"
            wait_check "$api/backup/storages/primary/checks" "$operation"
          done
          response="$(curl -fksS -b "$cookies" "${headers[@]}" -X POST "$api/backup/snapshots/$snapshot/restore-checks")"
          operation="$(printf '%s' "$response" | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')"
          wait_check "$api/backup/snapshots/$snapshot/restore-checks" "$operation"
          printf '%s' "$response" | python3 -c 'import json,sys;r=next(r for r in json.load(sys.stdin)["runs"] if r["id"]==sys.argv[1]);assert r["snapshot_id"]==sys.argv[2] and r["repository_id"]=="primary" and r["files"]==1 and r["bytes"]==20 and "SHA-256" in r["detail"]' "$operation" "$snapshot"
          curl -fksS -b "$cookies" "$api/backup/snapshots/$snapshot" |
            python3 -c 'import json,sys;s=json.load(sys.stdin);assert s["restore_check"]["state"]=="passed" and s["verification"]=="data_sha256_verified"'
          curl -fksS -b "$cookies" "$api/backup/storages" |
            python3 -c 'import json,sys;s=next(s for s in json.load(sys.stdin)["storages"] if s["id"]=="primary");assert s["metadata_check"]["state"]==s["data_check"]["state"]=="passed"'
          sudo test -z "$(sudo ls -A /var/lib/backuphub/restore-checks)"
          response="$(curl -fksS -b "$cookies" "${headers[@]}" -d '{"path":"Video"}' "$api/backup/snapshots/$snapshot/restore-checks")"
          operation="$(printf '%s' "$response" | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')"
          wait_check "$api/backup/snapshots/$snapshot/restore-checks" "$operation"
          printf '%s' "$response" | python3 -c 'import json,sys;r=next(r for r in json.load(sys.stdin)["runs"] if r["id"]==sys.argv[1]); assert r["selection"]=="Video" and r["files"]==1 and r["bytes"]==20' "$operation"
          # Test the shipped CLI against a second state directory.
          recovery_dir="$(mktemp -d)"
          sudo chown backuphub:backuphub "$recovery_dir"
          sudo runuser -u backuphub -- backuphub recovery export -kit "$recovery_dir/kit"
          sudo runuser -u backuphub -- backuphub recovery restore -kit "$recovery_dir/kit" -data-dir "$recovery_dir/restored"
          sudo runuser -u backuphub -- backuphub recovery reconcile -data-dir "$recovery_dir/restored" -repository-id primary |
            grep -F 'Repository primary: imported 0 snapshot(s)'
          sudo runuser -u backuphub -- backuphub admin-status -data-dir "$recovery_dir/restored" |
            grep -F 'Administrator configured'
          # A root-owned 0700 directory under /home must be readable by the
          # backup process without changing ownership/ACL or running it as root.
          sudo install -d -o root -g root -m 0700 /home/backuphub-ci-private
          printf '%s\n' 'protected-home-source' | sudo tee /home/backuphub-ci-private/private.txt > /dev/null
          sudo chmod 0600 /home/backuphub-ci-private/private.txt
          response="$(curl -fksS -b "$cookies" "${headers[@]}" -d '{"name":"CI root private home","kind":"local","path":"/home/backuphub-ci-private"}' "$api/backup/sources")"
          private_source="$(printf '%s' "$response" | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')"
          private_job="$(python3 -c 'import json,sys;print(json.dumps(dict(name="CI private home",source_id=sys.argv[1],repository_id="primary",schedule=dict(mode="daily",timezone="UTC",first_run="2099-01-01T02:00"))))' "$private_source")"
          response="$(curl -fksS -b "$cookies" "${headers[@]}" -d "$private_job" "$api/backup/jobs")"
          private_job_id="$(printf '%s' "$response" | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')"
          curl -fksS -b "$cookies" "${headers[@]}" -X POST "$api/backup/jobs/$private_job_id/run" > /dev/null
          private_snap=""
          for i in $(seq 1 60); do
            response="$(curl -fksS -b "$cookies" "$api/backup/snapshots?source_id=$private_source")"
            private_snap="$(printf '%s' "$response" | python3 -c 'import json,sys;a=json.load(sys.stdin)["snapshots"];print(a[0]["id"] if a else "")')"
            if [ -n "$private_snap" ]; then break; fi
            sleep 2
          done
          if [ -z "$private_snap" ]; then sudo journalctl -u backuphub -n 120 --no-pager; exit 1; fi
          curl -fksS -b "$cookies" "$api/backup/snapshots/$private_snap/download?mode=single&path=private.txt" -o /tmp/backuphub-private.txt
          grep -x 'protected-home-source' /tmp/backuphub-private.txt
          # Root helper is socket-activated; normal daemon remains unprivileged.
          sudo systemctl is-active --quiet backuphub-storage.socket
          curl -fksS -b "$cookies" "$api/backup/storages" | python3 -c 'import json,sys;assert any(s["id"]=="primary" for s in json.load(sys.stdin)["storages"])'
          curl -fksS -b "$cookies" "$api/backup/storages/mounts" | python3 -c 'import json,sys;assert isinstance(json.load(sys.stdin)["mounts"],list)'
          unsafe_status="$(curl -ksS -o /tmp/backuphub-unsafe.json -w '%{http_code}' -b "$cookies" "${headers[@]}" -d '{"name":"bad","parent_path":"/etc","folder":"backups"}' "$api/backup/storages")"
          test "$unsafe_status" = "400"
          # Administrator selects a passwordless default for NEW repositories.
          result="$(curl -fksS -b "$cookies" "${headers[@]}" -d '{"default_repository_password_mode":"no_password"}' "$api/system/settings")"
          printf '%s' "$result" | python3 -c 'import json,sys;assert json.load(sys.stdin)["default_repository_password_mode"]=="no_password"'
          # Legacy primary must remain protected regardless of the new preference.
          curl -fksS -b "$cookies" "$api/backup/storages" | python3 -c 'import json,sys;a=json.load(sys.stdin)["storages"];assert next(s for s in a if s["id"]=="primary")["password_mode"]=="password"'
          # Prefer actual mounted storage for a second end-to-end round trip.
          repo_id=""
          sudo mkdir -p /mnt/backuphub-ci
          if sudo mount --bind /mnt/backuphub-ci /mnt/backuphub-ci; then
            filesystem="$(findmnt -n -o FSTYPE --target /mnt/backuphub-ci)"
            if [[ "$filesystem" != overlay && "$filesystem" != tmpfs && "$filesystem" != autofs ]]; then
              volumes="$(curl -fksS -b "$cookies" "$api/backup/storages/mounts")"
              printf '%s' "$volumes" | python3 -c 'import json,sys;assert any(v["path"]=="/mnt/backuphub-ci" for v in json.load(sys.stdin)["mounts"])'
              second="$(curl -fksS -b "$cookies" "${headers[@]}" -d '{"name":"CI Disk 2","parent_path":"/mnt/backuphub-ci","folder":"BackupHubCI"}' "$api/backup/storages")"
              repo_id="$(printf '%s' "$second" | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')"
              test -n "$repo_id"
              printf '%s' "$second" | python3 -c 'import json,sys;assert json.load(sys.stdin)["password_mode"]=="no_password"'
              sudo test ! -e "/var/lib/backuphub/restic-$repo_id.key"
              # No sqlite database or saved encryption key required for disaster recovery.
              sudo runuser -u backuphub -- restic --repo /mnt/backuphub-ci/BackupHubCI/repository --insecure-no-password snapshots --json > /tmp/backuphub-passwordless-snapshots.json
              python3 -c 'import json;assert isinstance(json.load(open("/tmp/backuphub-passwordless-snapshots.json")),list)'
              sudo test "$(stat -c '%a' /mnt/backuphub-ci/BackupHubCI)" = 700
              sudo test "$(stat -c '%U' /mnt/backuphub-ci/BackupHubCI)" = backuphub
              # Switching destinations never moves or deletes an older snapshot.
              curl -fksS -b "$cookies" "${headers[@]}" -d "{\"repository_id\":\"$repo_id\"}" "$api/backup/jobs/$job_id/storage" > /dev/null
              echo 'on-second-disk' | sudo tee /opt/backuphub-smoke/Video/clip.txt > /dev/null
              sudo chown backuphub:backuphub /opt/backuphub-smoke/Video/clip.txt
              curl -fksS -b "$cookies" "${headers[@]}" -X POST "$api/backup/jobs/$job_id/run" > /dev/null
              new_snap=""
              for i in $(seq 1 60); do
                response="$(curl -fksS -b "$cookies" "$api/backup/snapshots?source_id=$source_id")"
                new_snap="$(printf '%s' "$response" | python3 -c 'import json,sys;a=json.load(sys.stdin)["snapshots"];print(a[0]["id"] if len(a)>=2 else "")')"
                if [ -n "$new_snap" ]; then break; fi
                sleep 2
              done
              test -n "$new_snap"
              response="$(curl -fksS -b "$cookies" "$api/backup/snapshots?source_id=$source_id")"
              printf '%s' "$response" | python3 -c 'import json,sys;a=json.load(sys.stdin)["snapshots"];assert a[0]["repository_id"]!="primary";assert a[1]["repository_id"]=="primary"'
              curl -fksS -b "$cookies" "$api/backup/snapshots/$new_snap/download?mode=single&path=Video%2Fclip.txt" -o /tmp/backuphub-second.txt
              grep -x 'on-second-disk' /tmp/backuphub-second.txt
              # Offline restore through stock Restic from the repo alone.
              native="$(sudo runuser -u backuphub -- restic --repo /mnt/backuphub-ci/BackupHubCI/repository --insecure-no-password snapshots --json --tag "bh-source-$source_id" | python3 -c 'import json,sys;a=json.load(sys.stdin);assert len(a)>0;print(a[-1]["id"])')"
              sudo runuser -u backuphub -- restic --repo /mnt/backuphub-ci/BackupHubCI/repository --insecure-no-password restore "$native" --target /mnt/backuphub-ci/BackupHubCI/restore-smoke
              sudo grep -rFx 'on-second-disk' /mnt/backuphub-ci/BackupHubCI/restore-smoke
              # Original data is still in the primary repository.
              curl -fksS -b "$cookies" "$api/backup/snapshots/$snapshot/download?mode=single&path=Video%2Fclip.txt" -o /tmp/backuphub-first.txt
              grep -x 'backuphub-roundtrip' /tmp/backuphub-first.txt
            else
              echo "Optional second-volume CI smoke skipped: runner root filesystem is $filesystem"
            fi
            sudo umount /mnt/backuphub-ci
            if [ -n "$repo_id" ]; then
              curl -fksS -b "$cookies" "$api/backup/storages" | python3 -c 'import json,sys; a=json.load(sys.stdin)["storages"]; assert any(s["id"]!="primary" and s["status"]=="unavailable" for s in a)'
              test ! -e /mnt/backuphub-ci/BackupHubCI/repository/config
            fi
          else
            echo "Optional second-volume CI smoke skipped: bind mounts unavailable"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: backuphub-debian-amd64
          path: |
            dist/*.deb
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release after acceptance checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deb]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: backuphub-debian-amd64
          path: release
      - name: Verify SHA256 of built Debian artifact
        run: |
          cd release
          sha256sum -c backuphub_0.6.1_amd64.deb.sha256
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.6.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.6.1 already published; refusing to overwrite release artifacts"
            exit 0
          fi
          gh release create v0.6.1 release/backuphub_0.6.1_amd64.deb release/backuphub_0.6.1_amd64.deb.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "BackupHub v0.6.1" \
            --notes-file docs/releases/v0.6.1.md
