name: Go CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: false
      - name: Verify locked Go dependencies
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Tests
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/backuphub
  restic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: false
      - name: Install Restic for actual repository round-trips
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y restic
      - name: Backup, commit, restore, verify and recovery test
        run: BACKUPHUB_RESTIC_REQUIRED=1 go test -race ./internal/storage/restic -v -count=1
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve and inspect npm lockfile
        run: |
          npm install --no-audit --no-fund
          echo 'BACKUPHUB_WEB_LOCK_BEGIN'
          cat package-lock.json
          echo 'BACKUPHUB_WEB_LOCK_END'
      - name: Svelte/TypeScript diagnostics
        run: npm run check
      - name: Build production UI
        run: npm run build
