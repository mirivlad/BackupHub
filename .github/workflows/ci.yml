name: Go CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: false
      - name: Resolve native connector dependencies and capture lockfile
        run: |
          go get github.com/hirochachacha/go-smb2/v2@latest github.com/pkg/sftp@v1.13.12
          go mod tidy
          echo BACKUPHUB_MOD_BEGIN
          cat go.mod
          echo BACKUPHUB_MOD_END
          echo BACKUPHUB_SUM_BEGIN
          cat go.sum
          echo BACKUPHUB_SUM_END
      - name: Tests
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/backuphub
  restic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: false
      - name: Install Restic for actual repository round-trips
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y restic
      - name: Resolve preview connector dependencies
        run: go get github.com/hirochachacha/go-smb2/v2@latest github.com/pkg/sftp@v1.13.12
      - name: Backup, commit, restore, verify and recovery test
        run: BACKUPHUB_RESTIC_REQUIRED=1 go test -race ./internal/storage/restic ./internal/backup -v -count=1
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify locked frontend dependencies
        run: |
          npm ci --no-audit --no-fund
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package.json package-lock.json
      - name: Svelte/TypeScript diagnostics
        run: npm run check
      - name: Build production UI
        run: npm run build

  deb:
    name: Debian package and install smoke test
    needs: [go, restic, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y restic postgresql-client openssl
      - name: Resolve preview dependencies
        run: go get github.com/hirochachacha/go-smb2/v2@latest github.com/pkg/sftp@v1.13.12
      - name: Compile production assets
        run: |
          cd web && npm ci --no-audit --no-fund && npm run check && npm run build
          cd .. && mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o dist/backuphub ./cmd/backuphub
      - name: Create and inspect .deb
        run: |
          sh packaging/debian/build.sh 0.1.0~preview.1
          dpkg-deb -c dist/backuphub_0.1.0~preview.1_amd64.deb | grep '/usr/share/backuphub/web/index.html'
          dpkg-deb -c dist/backuphub_0.1.0~preview.1_amd64.deb | grep '/lib/systemd/system/backuphub.service'
      - name: Install Debian package and test HTTPS service
        run: |
          sudo apt-get install -y ./dist/backuphub_0.1.0~preview.1_amd64.deb
          sudo systemctl restart backuphub
          sleep 4
          if ! curl -fk --max-time 15 https://127.0.0.1:8443/api/v1/health; then
            sudo journalctl -u backuphub -n 80 --no-pager
            exit 1
          fi
          curl -fk https://127.0.0.1:8443/ | grep BackupHub
      - uses: actions/upload-artifact@v4
        with:
          name: backuphub-debian-amd64-preview
          path: |
            dist/*.deb
            dist/*.sha256
          if-no-files-found: error
