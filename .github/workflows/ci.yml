name: Go CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: false
      - name: Resolve dependencies and record exact lockfiles
        run: |
          go mod tidy
          echo 'BACKUPHUB_MOD_BEGIN'
          cat go.mod
          echo 'BACKUPHUB_MOD_END'
          echo 'BACKUPHUB_SUM_BEGIN'
          cat go.sum
          echo 'BACKUPHUB_SUM_END'
      - name: Tests
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/backuphub
