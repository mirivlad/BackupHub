name: Go CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: false
      - name: Verify locked Go dependencies
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Tests
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/backuphub
  restic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: false
      - name: Install Restic for actual repository round-trips
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y restic
      - name: Backup, commit, restore, verify and recovery test
        run: BACKUPHUB_RESTIC_REQUIRED=1 go test -race ./internal/storage/restic ./internal/backup -v -count=1
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify locked frontend dependencies
        run: |
          npm ci --no-audit --no-fund
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package.json package-lock.json
      - name: Svelte/TypeScript diagnostics
        run: npm run check
      - name: Build production UI
        run: npm run build

  deb:
    name: Debian package and install smoke test
    needs: [go, restic, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y restic postgresql-client openssl
      - name: Compile production assets
        run: |
          cd web && npm ci --no-audit --no-fund && npm run check && npm run build
          cd .. && mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o dist/backuphub ./cmd/backuphub
          if file dist/backuphub | grep -q 'dynamically linked'; then echo 'DEB binary must not depend on the CI runner glibc'; exit 1; fi
      - name: Create and inspect .deb
        run: |
          sh packaging/debian/build.sh 0.1.0~preview.4
          dpkg-deb -c dist/backuphub_0.1.0~preview.4_amd64.deb | grep '/usr/share/backuphub/web/index.html'
          dpkg-deb -c dist/backuphub_0.1.0~preview.4_amd64.deb | grep '/lib/systemd/system/backuphub.service'
      - name: Install Debian package and test HTTPS service
        run: |
          sudo apt-get install -y ./dist/backuphub_0.1.0~preview.4_amd64.deb
          # postinst starts the daemon and initializes Restic; do not interrupt it.
          ready=false
          for i in $(seq 1 30); do
            if curl -fk --max-time 3 https://127.0.0.1:8443/api/v1/health; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            sudo journalctl -u backuphub -n 100 --no-pager
            exit 1
          fi
          # A subsequent ordinary systemd restart must preserve credentials.
          sudo systemctl restart backuphub
          sleep 2
          curl -fk --retry 5 --retry-delay 2 --retry-connrefused https://127.0.0.1:8443/api/v1/health
          curl -fk https://127.0.0.1:8443/ | grep BackupHub
      - name: End-to-end packaged HTTPS login, backup, ZIP and restore
        run: |
          set -eu
          sudo install -d -o backuphub -g backuphub -m 0700 /opt/backuphub-smoke /opt/backuphub-smoke/Video
          echo 'preview-roundtrip' | sudo tee /opt/backuphub-smoke/Video/clip.txt > /dev/null
          sudo chown backuphub:backuphub /opt/backuphub-smoke/Video/clip.txt
          sudo chmod 0600 /opt/backuphub-smoke/Video/clip.txt
          token="$(sudo runuser -u backuphub -- /usr/bin/backuphub bootstrap -data-dir /var/lib/backuphub | sed -n '2p')"
          test -n "$token"
          api=https://127.0.0.1:8443/api/v1
          curl -fksS -H 'Content-Type: application/json' -d "{\"bootstrap_token\":\"$token\",\"username\":\"smokeadmin\",\"password\":\"test-only-password-for-ci-12345\"}" "$api/setup/admin" > /dev/null
          cookies=/tmp/backuphub-ci-cookies.txt
          curl -fksS -c "$cookies" -H 'Content-Type: application/json' -d '{"username":"smokeadmin","password":"test-only-password-for-ci-12345"}' "$api/auth/login" > /dev/null
          csrf="$(awk '$6 == "backuphub_csrf" {print $7}' "$cookies")"
          test -n "$csrf"
          headers=(-H "X-BackupHub-CSRF: $csrf" -H "Content-Type: application/json")
          response="$(curl -fksS -b "$cookies" "${headers[@]}" -d '{"name":"CI local dataset","kind":"local","path":"/opt/backuphub-smoke","interval_minutes":60}' "$api/backup/sources")"
          source_id="$(printf '%s' "$response" | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')"
          test -n "$source_id"
          curl -fksS -b "$cookies" "${headers[@]}" -X POST "$api/backup/sources/$source_id/run" > /dev/null
          snapshot=""
          for i in $(seq 1 60); do
            response="$(curl -fksS -b "$cookies" "$api/backup/snapshots?source_id=$source_id")"
            snapshot="$(printf '%s' "$response" | python3 -c 'import json,sys;a=json.load(sys.stdin)["snapshots"];print(a[0]["id"] if a else "")')"
            if [ -n "$snapshot" ]; then break; fi
            sleep 2
          done
          if [ -z "$snapshot" ]; then sudo journalctl -u backuphub -n 100 --no-pager; exit 1; fi
          curl -fksS -b "$cookies" "$api/backup/snapshots/$snapshot/download?path=Video" -o /tmp/backuphub-smoke.zip
          python3 -c 'import zipfile; z=zipfile.ZipFile("/tmp/backuphub-smoke.zip"); assert z.read("Video/clip.txt").strip()==b"preview-roundtrip"'
          curl -fksS -b "$cookies" "$api/backup/snapshots/$snapshot/download?mode=single&path=Video%2Fclip.txt" -o /tmp/backuphub-smoke.txt
          grep -x 'preview-roundtrip' /tmp/backuphub-smoke.txt
          sudo rm /opt/backuphub-smoke/Video/clip.txt
          result="$(curl -fksS -b "$cookies" "${headers[@]}" -d '{"paths":["Video/clip.txt"]}' "$api/backup/snapshots/$snapshot/restore")"
          restored="$(printf '%s' "$result" | python3 -c 'import json,sys;print(json.load(sys.stdin)["directory"])')"
          test -n "$restored"
          sudo grep -x 'preview-roundtrip' "$restored/Video/clip.txt"
          test ! -f /opt/backuphub-smoke/Video/clip.txt
          # Root helper is socket-activated; normal daemon remains unprivileged.
          sudo systemctl is-active --quiet backuphub-storage.socket
          curl -fksS -b "$cookies" "$api/backup/storages" | python3 -c 'import json,sys;assert any(s["id"]=="primary" for s in json.load(sys.stdin)["storages"])'
          curl -fksS -b "$cookies" "$api/backup/storages/mounts" | python3 -c 'import json,sys;assert isinstance(json.load(sys.stdin)["mounts"],list)'
          unsafe_status="$(curl -ksS -o /tmp/backuphub-unsafe.json -w '%{http_code}' -b "$cookies" "${headers[@]}" -d '{"name":"bad","parent_path":"/etc","folder":"backups"}' "$api/backup/storages")"
          test "$unsafe_status" = "400"
          # Administrator selects a passwordless default for NEW repositories.
          result="$(curl -fksS -b "$cookies" "${headers[@]}" -d '{"default_repository_password_mode":"no_password"}' "$api/system/settings")"
          printf '%s' "$result" | python3 -c 'import json,sys;assert json.load(sys.stdin)["default_repository_password_mode"]=="no_password"'
          # Legacy primary must remain protected regardless of the new preference.
          curl -fksS -b "$cookies" "$api/backup/storages" | python3 -c 'import json,sys;a=json.load(sys.stdin)["storages"];assert next(s for s in a if s["id"]=="primary")["password_mode"]=="password"'
          # Operator can export a consistent ZIP with catalog and recovery keys.
          curl -fksS -b "$cookies" "$api/system/recovery-kit" -o /tmp/backuphub-ci-recovery-kit.zip
          python3 -c 'import zipfile,json;z=zipfile.ZipFile("/tmp/backuphub-ci-recovery-kit.zip");m=json.loads(z.read("recovery-manifest.json"));assert m["format"]=="backuphub.recovery-kit.v1";assert all(x in z.namelist() for x in ["catalog.db","restic.key","master.key"])'
          sudo install -m 0600 -o backuphub -g backuphub /tmp/backuphub-ci-recovery-kit.zip /var/lib/backuphub/ci-recovery-kit.zip
          sudo runuser -u backuphub -- backuphub recovery-kit-restore -kit /var/lib/backuphub/ci-recovery-kit.zip -data-dir /var/lib/backuphub/ci-restored
          sudo test -f /var/lib/backuphub/ci-restored/catalog.db
          sudo test -f /var/lib/backuphub/ci-restored/master.key
          # Recovery never overwrites a populated state directory.
          if sudo runuser -u backuphub -- backuphub recovery-kit-restore -kit /var/lib/backuphub/ci-recovery-kit.zip -data-dir /var/lib/backuphub/ci-restored; then
            echo "Recovery Kit unexpectedly overwrote an existing state directory"; exit 1
          fi
          # Prefer actual mounted storage for a second end-to-end round trip.
          repo_id=""
          sudo mkdir -p /mnt/backuphub-ci
          if sudo mount --bind /mnt/backuphub-ci /mnt/backuphub-ci; then
            filesystem="$(findmnt -n -o FSTYPE --target /mnt/backuphub-ci)"
            if [[ "$filesystem" != overlay && "$filesystem" != tmpfs && "$filesystem" != autofs ]]; then
              volumes="$(curl -fksS -b "$cookies" "$api/backup/storages/mounts")"
              printf '%s' "$volumes" | python3 -c 'import json,sys;assert any(v["path"]=="/mnt/backuphub-ci" for v in json.load(sys.stdin)["mounts"])'
              second="$(curl -fksS -b "$cookies" "${headers[@]}" -d '{"name":"CI Disk 2","parent_path":"/mnt/backuphub-ci","folder":"BackupHubCI"}' "$api/backup/storages")"
              repo_id="$(printf '%s' "$second" | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')"
              test -n "$repo_id"
              printf '%s' "$second" | python3 -c 'import json,sys;assert json.load(sys.stdin)["password_mode"]=="no_password"'
              sudo test ! -e "/var/lib/backuphub/restic-$repo_id.key"
              # No sqlite database or saved encryption key required for disaster recovery.
              sudo runuser -u backuphub -- restic --repo /mnt/backuphub-ci/BackupHubCI/repository --insecure-no-password snapshots --json > /tmp/backuphub-passwordless-snapshots.json
              python3 -c 'import json;assert isinstance(json.load(open("/tmp/backuphub-passwordless-snapshots.json")),list)'
              sudo test "$(stat -c '%a' /mnt/backuphub-ci/BackupHubCI)" = 700
              sudo test "$(stat -c '%U' /mnt/backuphub-ci/BackupHubCI)" = backuphub
              # Switching destinations never moves or deletes an older snapshot.
              curl -fksS -b "$cookies" "${headers[@]}" -d "{\"repository_id\":\"$repo_id\"}" "$api/backup/sources/$source_id/storage" > /dev/null
              echo 'on-second-disk' | sudo tee /opt/backuphub-smoke/Video/clip.txt > /dev/null
              sudo chown backuphub:backuphub /opt/backuphub-smoke/Video/clip.txt
              curl -fksS -b "$cookies" "${headers[@]}" -X POST "$api/backup/sources/$source_id/run" > /dev/null
              new_snap=""
              for i in $(seq 1 60); do
                response="$(curl -fksS -b "$cookies" "$api/backup/snapshots?source_id=$source_id")"
                new_snap="$(printf '%s' "$response" | python3 -c 'import json,sys;a=json.load(sys.stdin)["snapshots"];print(a[0]["id"] if len(a)>=2 else "")')"
                if [ -n "$new_snap" ]; then break; fi
                sleep 2
              done
              test -n "$new_snap"
              response="$(curl -fksS -b "$cookies" "$api/backup/snapshots?source_id=$source_id")"
              printf '%s' "$response" | python3 -c 'import json,sys;a=json.load(sys.stdin)["snapshots"];assert a[0]["repository_id"]!="primary";assert a[1]["repository_id"]=="primary"'
              curl -fksS -b "$cookies" "$api/backup/snapshots/$new_snap/download?mode=single&path=Video%2Fclip.txt" -o /tmp/backuphub-second.txt
              grep -x 'on-second-disk' /tmp/backuphub-second.txt
              # A second fresh BackupHub has NO original SQLite or Restic keys.
              sudo install -d -m 0700 -o backuphub -g backuphub /var/lib/backuphub-ci-clean
              sudo runuser -u backuphub -- backuphub init -data-dir /var/lib/backuphub-ci-clean
              sudo systemd-run --unit=backuphub-recovery-ci --property=User=backuphub --property=Group=backuphub -- /usr/bin/backuphub serve -data-dir /var/lib/backuphub-ci-clean -listen 127.0.0.1:8444 -tls-cert /etc/backuphub/server.crt -tls-key /etc/backuphub/server.key
              cleanapi=https://127.0.0.1:8444/api/v1
              ready=false
              for i in $(seq 1 30); do
                if curl -fksS --max-time 3 "$cleanapi/health" >/dev/null; then ready=true; break; fi
                sleep 2
              done
              if [ "$ready" != true ]; then sudo journalctl -u backuphub-recovery-ci -n 80 --no-pager; exit 1; fi
              clean_token="$(sudo runuser -u backuphub -- backuphub bootstrap -data-dir /var/lib/backuphub-ci-clean | sed -n '2p')"
              curl -fksS -H 'Content-Type: application/json' -d "{\"bootstrap_token\":\"$clean_token\",\"username\":\"recoveryadmin\",\"password\":\"test-only-recovery-password-ci-1234\"}" "$cleanapi/setup/admin" > /dev/null
              clean_cookies=/tmp/backuphub-ci-clean-cookies.txt
              curl -fksS -c "$clean_cookies" -H 'Content-Type: application/json' -d '{"username":"recoveryadmin","password":"test-only-recovery-password-ci-1234"}' "$cleanapi/auth/login" > /dev/null
              clean_csrf="$(awk '$6 == "backuphub_csrf" {print $7}' "$clean_cookies")"
              test -n "$clean_csrf"
              imported="$(curl -fksS -b "$clean_cookies" -H "X-BackupHub-CSRF: $clean_csrf" -H "Content-Type: application/json" -d '{"name":"Recovered Disk","parent_path":"/mnt/backuphub-ci/BackupHubCI","password_mode":"no_password"}' "$cleanapi/backup/storages/import")"
              printf '%s' "$imported" | python3 -c 'import json,sys;r=json.load(sys.stdin);assert r["snapshots"]==1 and r["sources"]==1 and r["storage"]["password_mode"]=="no_password"'
              curl -fksS -b "$clean_cookies" "$cleanapi/backup/snapshots" | python3 -c 'import json,sys;a=json.load(sys.stdin)["snapshots"];assert len(a)==1 and a[0]["repository_id"]!="primary"'
              curl -fksS -b "$clean_cookies" "$cleanapi/backup/sources" | python3 -c 'import json,sys;assert json.load(sys.stdin)["sources"]==[]'
              curl -fksS -b "$clean_cookies" "$cleanapi/backup/snapshots/$new_snap/download?mode=single&path=Video%2Fclip.txt" -o /tmp/backuphub-ci-disaster-restored.txt
              grep -x 'on-second-disk' /tmp/backuphub-ci-disaster-restored.txt
              sudo test ! -e /var/lib/backuphub-ci-clean/restic-*.key
              # Also prove protected archives need the ORIGINAL key, and that
              # a wrong key is rejected without polluting the recovered catalog.
              protected="$(curl -fksS -b "$cookies" "${headers[@]}" -d '{"name":"CI Protected Volume","parent_path":"/mnt/backuphub-ci","folder":"BackupHubProtected","password_mode":"password"}' "$api/backup/storages")"
              protected_id="$(printf '%s' "$protected" | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')"
              test -n "$protected_id"
              curl -fksS -b "$cookies" "${headers[@]}" -d "{\"repository_id\":\"$protected_id\"}" "$api/backup/sources/$source_id/storage" >/dev/null
              echo 'protected-recovery' | sudo tee /opt/backuphub-smoke/Video/clip.txt >/dev/null
              sudo chown backuphub:backuphub /opt/backuphub-smoke/Video/clip.txt
              curl -fksS -b "$cookies" "${headers[@]}" -X POST "$api/backup/sources/$source_id/run" >/dev/null
              protected_snap=""
              for i in $(seq 1 60); do
                response="$(curl -fksS -b "$cookies" "$api/backup/snapshots?source_id=$source_id")"
                protected_snap="$(printf '%s' "$response" | python3 -c 'import json,sys;a=json.load(sys.stdin)["snapshots"];print(a[0]["id"] if len(a)>=3 else "")')"
                if [ -n "$protected_snap" ]; then break; fi
                sleep 2
              done
              test -n "$protected_snap"
              bad_key="$(printf '0%.0s' {1..96})"
              status="$(curl -ksS -b "$clean_cookies" -o /tmp/backuphub-recovery-wrong-key.json -w '%{http_code}' -H "X-BackupHub-CSRF: $clean_csrf" -H "Content-Type: application/json" -d "{\"name\":\"Recovered Protected\",\"parent_path\":\"/mnt/backuphub-ci/BackupHubProtected\",\"password_mode\":\"password\",\"password\":\"$bad_key\"}" "$cleanapi/backup/storages/import")"
              test "$status" = "400"
              test "$(find /var/lib/backuphub-ci-clean -maxdepth 1 -name 'restic-*.key' | wc -l)" -eq 0
              secret="$(sudo cat "/var/lib/backuphub/restic-$protected_id.key")"
              imported_protected="$(curl -fksS -b "$clean_cookies" -H "X-BackupHub-CSRF: $clean_csrf" -H "Content-Type: application/json" -d "{\"name\":\"Recovered Protected\",\"parent_path\":\"/mnt/backuphub-ci/BackupHubProtected\",\"password_mode\":\"password\",\"password\":\"$secret\"}" "$cleanapi/backup/storages/import")"
              printf '%s' "$imported_protected" | python3 -c 'import json,sys;r=json.load(sys.stdin);assert r["snapshots"]==1 and r["sources"]==0 and r["storage"]["password_mode"]=="password"'
              curl -fksS -b "$clean_cookies" "$cleanapi/backup/snapshots?source_id=$source_id" | python3 -c 'import json,sys;assert len(json.load(sys.stdin)["snapshots"])==2'
              curl -fksS -b "$clean_cookies" "$cleanapi/backup/snapshots/$protected_snap/download?mode=single&path=Video%2Fclip.txt" -o /tmp/backuphub-ci-protected-recovered.txt
              grep -x 'protected-recovery' /tmp/backuphub-ci-protected-recovered.txt
              # Full browser workflow: export one ZIP on the old server,
              # upload it to a clean BackupHub and replace its state safely.
              curl -fksS -b "$cookies" "$api/system/recovery-kit" -o /tmp/backuphub-ci-full-kit.zip
              sudo install -d -o backuphub -g backuphub -m 0700 /var/lib/backuphub-kit-ci
              sudo runuser -u backuphub -- backuphub init -data-dir /var/lib/backuphub-kit-ci
              sudo systemd-run --unit=backuphub-kit-ci --property=User=backuphub --property=Group=backuphub -- /usr/bin/backuphub serve -data-dir /var/lib/backuphub-kit-ci -listen 127.0.0.1:8445 -tls-cert /etc/backuphub/server.crt -tls-key /etc/backuphub/server.key
              kitapi=https://127.0.0.1:8445/api/v1
              ready=false
              for i in $(seq 1 30); do
                if curl -fksS --max-time 3 "$kitapi/health" >/dev/null; then ready=true; break; fi
                sleep 2
              done
              if [ "$ready" != true ]; then sudo journalctl -u backuphub-kit-ci -n 80 --no-pager; exit 1; fi
              kit_token="$(sudo runuser -u backuphub -- backuphub bootstrap -data-dir /var/lib/backuphub-kit-ci | sed -n '2p')"
              curl -fksS -H 'Content-Type: application/json' -d "{\"bootstrap_token\":\"$kit_token\",\"username\":\"tempadmin\",\"password\":\"temporary-admin-password-for-ci-1234\"}" "$kitapi/setup/admin" >/dev/null
              kit_cookies=/tmp/backuphub-kit-cookies.txt
              curl -fksS -c "$kit_cookies" -H 'Content-Type: application/json' -d '{"username":"tempadmin","password":"temporary-admin-password-for-ci-1234"}' "$kitapi/auth/login" >/dev/null
              kit_csrf="$(awk '$6 == "backuphub_csrf" {print $7}' "$kit_cookies")"
              test -n "$kit_csrf"
              curl -fksS -b "$kit_cookies" -H "X-BackupHub-CSRF: $kit_csrf" -H 'X-BackupHub-Recovery-Confirm: REPLACE_EMPTY_INSTALL' -F "kit=@/tmp/backuphub-ci-full-kit.zip;type=application/zip" "$kitapi/system/recovery-kit/import" > /tmp/backuphub-ci-browser-import.json
              python3 -c 'import json;d=json.load(open("/tmp/backuphub-ci-browser-import.json"));assert d["staged"] and d["restart_requested"]'
              for i in $(seq 1 30); do
                if ! sudo systemctl is-active --quiet backuphub-kit-ci.service; then break; fi
                sleep 1
              done
              test -f /var/lib/backuphub-kit-ci/.recovery-kit-apply.json
              # The DEB's root-only ExecStartPre executes this on automatic
              # restart; here we invoke the same command to test the swap in
              # an independent transient unit (which has no Restart policy).
              sudo backuphub recovery-kit-apply -data-dir /var/lib/backuphub-kit-ci
              sudo test -f /var/lib/backuphub-kit-ci.before-recovery/catalog.db
              sudo test -f /var/lib/backuphub-kit-ci/catalog.db
              sudo systemd-run --unit=backuphub-kit-restored-ci --property=User=backuphub --property=Group=backuphub -- /usr/bin/backuphub serve -data-dir /var/lib/backuphub-kit-ci -listen 127.0.0.1:8445 -tls-cert /etc/backuphub/server.crt -tls-key /etc/backuphub/server.key
              ready=false
              for i in $(seq 1 30); do
                if curl -fksS --max-time 3 "$kitapi/health" >/dev/null; then ready=true; break; fi
                sleep 2
              done
              if [ "$ready" != true ]; then sudo journalctl -u backuphub-kit-restored-ci -n 80 --no-pager; exit 1; fi
              kit_restored_cookies=/tmp/backuphub-kit-restored-cookies.txt
              curl -fksS -c "$kit_restored_cookies" -H 'Content-Type: application/json' -d '{"username":"smokeadmin","password":"test-only-password-for-ci-12345"}' "$kitapi/auth/login" >/dev/null
              restored_csrf="$(awk '$6 == "backuphub_csrf" {print $7}' "$kit_restored_cookies")"
              test -n "$restored_csrf"
              curl -fksS -b "$kit_restored_cookies" "$kitapi/backup/sources" | python3 -c 'import json,sys;s=json.load(sys.stdin)["sources"];assert len(s)==1 and s[0]["enabled"] is False'
              curl -fksS -b "$kit_restored_cookies" "$kitapi/backup/snapshots?source_id=$source_id" | python3 -c 'import json,sys;assert len(json.load(sys.stdin)["snapshots"])==3'
              sudo mkdir -p /mnt/backuphub-kit-remount
              sudo mount --bind /mnt/backuphub-ci /mnt/backuphub-kit-remount
              new_parent=/mnt/backuphub-kit-remount/BackupHubCI
              relink="$(curl -fksS -b "$kit_restored_cookies" -H "X-BackupHub-CSRF: $restored_csrf" -H 'Content-Type: application/json' -d "{\"parent_path\":\"$new_parent\"}" "$kitapi/backup/storages/$repo_id/rebind")"
              printf '%s' "$relink" | python3 -c 'import json,sys;s=json.load(sys.stdin);assert s["status"]=="available" and s["path"]=="/mnt/backuphub-kit-remount/BackupHubCI/repository"'
              curl -fksS -b "$kit_restored_cookies" "$kitapi/backup/snapshots/$new_snap/download?mode=single&path=Video%2Fclip.txt" -o /tmp/backuphub-kit-mounted-recovered.txt
              grep -x 'on-second-disk' /tmp/backuphub-kit-mounted-recovered.txt
              sudo systemctl stop backuphub-kit-restored-ci.service
              sudo umount /mnt/backuphub-kit-remount
              sudo systemctl stop backuphub-recovery-ci.service

              # Offline restore through stock Restic from the repo alone.
              native="$(sudo runuser -u backuphub -- restic --repo /mnt/backuphub-ci/BackupHubCI/repository --insecure-no-password snapshots --json --tag "bh-source-$source_id" | python3 -c 'import json,sys;a=json.load(sys.stdin);assert len(a)>0;print(a[-1]["id"])')"
              sudo runuser -u backuphub -- restic --repo /mnt/backuphub-ci/BackupHubCI/repository --insecure-no-password restore "$native" --target /mnt/backuphub-ci/BackupHubCI/restore-smoke
              sudo grep -rFx 'on-second-disk' /mnt/backuphub-ci/BackupHubCI/restore-smoke
              # Original data is still in the primary repository.
              curl -fksS -b "$cookies" "$api/backup/snapshots/$snapshot/download?mode=single&path=Video%2Fclip.txt" -o /tmp/backuphub-first.txt
              grep -x 'preview-roundtrip' /tmp/backuphub-first.txt
            else
              echo "Optional second-volume CI smoke skipped: runner root filesystem is $filesystem"
            fi
            sudo umount /mnt/backuphub-ci
            if [ -n "$repo_id" ]; then
              curl -fksS -b "$cookies" "$api/backup/storages" | python3 -c 'import json,sys; a=json.load(sys.stdin)["storages"]; assert any(s["id"]!="primary" and s["status"]=="unavailable" for s in a)'
              test ! -e /mnt/backuphub-ci/BackupHubCI/repository/config
            fi
          else
            echo "Optional second-volume CI smoke skipped: bind mounts unavailable"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: backuphub-debian-amd64-preview
          path: |
            dist/*.deb
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub prerelease after acceptance checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deb]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: backuphub-debian-amd64-preview
          path: release
      - name: Verify SHA256 of built Debian artifact
        run: |
          cd release
          sha256sum -c backuphub_0.1.0~preview.4_amd64.deb.sha256
      - name: Publish immutable prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0-preview.4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.1.0-preview.4 already published; refusing to overwrite release artifacts"
            exit 0
          fi
          gh release create v0.1.0-preview.4 release/backuphub_0.1.0~preview.4_amd64.deb release/backuphub_0.1.0~preview.4_amd64.deb.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "BackupHub v0.1.0 Preview 4" \
            --prerelease --notes-file docs/releases/v0.1.0-preview.4.md
